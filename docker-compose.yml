version: '3.8'

services:
  # 1. MongoDB Database
  mongo:
    image: mongo:7-jammy
    container_name: insightforge-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - insightforge-net
    restart: unless-stopped

  # 2. Redis Message Broker & Semantic Cache
  redis:
    image: redis:7-alpine
    container_name: insightforge-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - insightforge-net
    restart: unless-stopped

  # 3. Python FastAPI LangGraph Multi-Agent Service
  agent-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent-service
    container_name: insightforge-agent-service
    ports:
      - "8000:8000"
    environment:
      - AGENT_SERVICE_PORT=8000
      - AGENT_SERVICE_HOST=0.0.0.0
      - BACKEND_URL=http://backend:5000
      - REDIS_URL=redis://redis:6379
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - MCP_WEB_SEARCH_URL=http://mcp-web-search:4001/sse
      - MCP_DOC_RETRIEVAL_URL=http://mcp-doc-retrieval:4002/sse
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - insightforge-net
    restart: unless-stopped

  # 4. MCP Tool Server: Web Search
  mcp-web-search:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp-web-search
    container_name: insightforge-mcp-web-search
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SERPER_API_KEY=${SERPER_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - insightforge-net
    restart: unless-stopped

  # 5. MCP Tool Server: Document Retrieval & Hybrid RAG
  mcp-doc-retrieval:
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp-doc-retrieval
    container_name: insightforge-mcp-doc-retrieval
    ports:
      - "4002:4002"
    environment:
      - NODE_ENV=production
      - PORT=4002
      - BACKEND_API_URL=http://backend:5000
      - VECTOR_DB_PATH=/app/data/vector_db
    volumes:
      - vector_data:/app/data/vector_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - insightforge-net
    restart: unless-stopped

  # 6. Node.js Express Backend API & WebSocket Gateway
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: insightforge-backend
    ports:
      - "${PORT:-5000}:5000"
      - "${WS_PORT:-5001}:5001"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - WS_PORT=5001
      - RUN_EMBEDDED_WORKER=false
      - MONGODB_URI=mongodb://mongo:27017/insightforge
      - REDIS_URL=redis://redis:6379
      - AGENT_SERVICE_URL=http://agent-service:8000
      - MCP_WEB_SEARCH_URL=http://mcp-web-search:4001/sse
      - MCP_DOC_RETRIEVAL_URL=http://mcp-doc-retrieval:4002/sse
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-service:
        condition: service_healthy
      mcp-web-search:
        condition: service_healthy
      mcp-doc-retrieval:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - model_cache:/app/data/models
    networks:
      - insightforge-net
    restart: unless-stopped

  # 7. Dedicated BullMQ Background Research Worker
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: insightforge-worker
    command: ["node", "backend/dist/worker.js"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/insightforge
      - REDIS_URL=redis://redis:6379
      - AGENT_SERVICE_URL=http://agent-service:8000
      - WORKER_CONCURRENCY=3
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    volumes:
      - model_cache:/app/data/models
    networks:
      - insightforge-net
    restart: unless-stopped

  # 8. React + Vite Frontend (served via Nginx with API/WS reverse proxy)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: insightforge-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - insightforge-net
    restart: unless-stopped

networks:
  insightforge-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  vector_data:
  model_cache:
